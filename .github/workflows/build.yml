name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Verify bundled speech recognition on Windows
      run: npm run test:local-asr

    - name: Build Windows app
      run: node scripts/run-with-retry.js --attempts 3 --delay-ms 15000 -- npm run build:win -- --x64
      env:
        CSC_LINK: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.CSC_LINK || '' }}
        CSC_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.CSC_KEY_PASSWORD || '' }}

    - name: Include update manifest for signed builds
      shell: pwsh
      run: |
        if (-not $env:CSC_LINK) {
          if (Test-Path -LiteralPath 'dist/latest.yml') { Remove-Item -LiteralPath 'dist/latest.yml' }
          exit 0
        }
        $installer = Get-ChildItem -Path dist/*.exe
        if (@($installer).Count -ne 1 -or (Get-AuthenticodeSignature -LiteralPath $installer.FullName).Status -ne 'Valid') {
          throw 'Expected a signed NSIS installer'
        }
        if (-not (Test-Path -LiteralPath 'dist/latest.yml') -or
            -not (Select-String -LiteralPath 'dist/win-unpacked/resources/app-update.yml' -Pattern '^publisherName:')) {
          throw 'Expected a Windows update manifest and publisher'
        }
      env:
        CSC_LINK: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.CSC_LINK || '' }}
        
    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-installer
        path: |
          dist/*.exe
          dist/latest.yml
        retention-days: 7

  build-macos:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build macOS app
      run: node scripts/run-with-retry.js --attempts 3 --delay-ms 15000 -- npm run build:mac
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Upload macOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: macos-installer
        path: dist/*.dmg
        retention-days: 7

  build-linux-x64:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libarchive-tools rpm

    - name: Install dependencies
      run: npm ci

    - name: Build and verify the Linux x64 speech addon on glibc 2.31
      run: |
        npm run prepare:local-asr
        docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/workspace" -w /workspace \
          node:20-bullseye bash -ec 'bash scripts/rebuild-linux-x64-asr.sh && node tests/integration/local-asr-runtime.js'

    - name: Build Linux x64 app
      run: node scripts/run-with-retry.js --attempts 3 --delay-ms 15000 -- npm run build:linux
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Linux x64 artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-x64-installer
        path: |
          dist/*.AppImage
          dist/*.deb
          dist/latest-linux.yml
        retention-days: 7

  build-linux-arm64:
    runs-on: ubuntu-22.04-arm

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libnotify-dev libnss3 libxss1 libasound2 libxtst6 xdg-utils libatspi2.0-dev libsecret-1-dev libdbus-1-dev
        sudo apt-get install -y libarchive-tools rpm

    - name: Install dependencies
      run: npm ci

    - name: Verify bundled speech recognition on Linux ARM64
      run: npm run test:local-asr

    - name: Build Linux ARM64 app
      run: node scripts/run-with-retry.js --attempts 3 --delay-ms 15000 -- npm run build:linux -- --arm64
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Linux ARM64 artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-arm64-installer
        path: |
          dist/*.AppImage
          dist/*.deb
          dist/latest-linux-arm64.yml
        retention-days: 7

  release:
    needs: [build-windows, build-macos, build-linux-x64, build-linux-arm64]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    concurrency:
      group: stable-app-release
      queue: max
    
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    - run: npm ci --ignore-scripts

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        
    - name: Verify update artifacts
      run: node scripts/verify-update-artifacts.js "$GITHUB_REF_NAME"

    - name: Publish validated release
      shell: bash
      run: |
        tag="$GITHUB_REF_NAME"
        gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
          node scripts/check-release-order.js "$tag"
        if draft=$(gh release view "$tag" --json isDraft --jq .isDraft); then
          test "$draft" = true
        else
          gh release create "$tag" --draft --generate-notes --verify-tag
        fi
        gh release upload "$tag" artifacts/*/* --clobber
        gh release edit "$tag" --draft=false --latest
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
